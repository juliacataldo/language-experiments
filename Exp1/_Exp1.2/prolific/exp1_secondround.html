  <body></body>

  <script>
    async function startExperiment() {
      // ==============================================================
      // 1. GENERAL SETTINGS
      // ==============================================================

      /*
       * Change these labels if your task asks a different rating question.
       *
       * The current wording is appropriate for semantic norming:
       * participants judge how well the sentence describes the word's
       * meaning.
       */
      var RATING_QUESTION =
        "Quão bem a paráfrase descreve o significado da palavra?";

      var LOW_ENDPOINT_LABEL = "1 — Muito ruim";
      var HIGH_ENDPOINT_LABEL = "7 — Muito bom";

      /*
       * Upload the approved consent PDF to the same folder as this file
       * and name it consent.pdf. Change this value only if you use a
       * different filename.
       */
      var CONSENT_PDF_FILE = "consent.pdf";

      /*
       * Keep main_stimuli_des_secondround_counterbalanced.csv in the same folder
       * as this HTML file.
       *
       * Replace the DataPipe placeholder before putting the experiment
       * online. Do not put your private OSF token in this file.
       */
      var PRACTICE_STIMULI_FILE = "practice_stimuli.csv";
      var MAIN_STIMULI_FILE =
        "main_stimuli_des_secondround_counterbalanced.csv";
      var DATAPIPE_EXPERIMENT_ID =
        "7xrpzvYgeAtA";

      /*
       * Automatic saving mode:
       * - localhost / 127.0.0.1 / 0.0.0.0: serve.py saves locally
       * - GitHub Pages or another online host: DataPipe saves to OSF
       */
      var LOCAL_HOSTNAMES = [
        "localhost",
        "127.0.0.1",
        "0.0.0.0"
      ];

      var IS_LOCAL_RUN =
        LOCAL_HOSTNAMES.includes(window.location.hostname);

      var RUN_MODE =
        IS_LOCAL_RUN
          ? "local"
          : "online_datapipe";

      if (window.location.protocol === "file:") {
        throw new Error(
          "This experiment loads practice_stimuli.csv and " +
          "main_stimuli_des_secondround_counterbalanced.csv. Run it through " +
          "http://localhost:8000/ instead of double-clicking " +
          "exp1_secondround_counterbalanced.html."
        );
      }

      if (
        !IS_LOCAL_RUN &&
        DATAPIPE_EXPERIMENT_ID ===
          "PASTE_YOUR_DATAPIPE_EXPERIMENT_ID_HERE"
      ) {
        throw new Error(
          "Online saving is not configured. Replace the DataPipe " +
          "Experiment ID placeholder in exp1.html."
        );
      }

      var jsPsych = initJsPsych({
        show_progress_bar: true,
        auto_update_progress_bar: false,
        message_progress_bar: "Progresso do experimento"
      });

      var timeline = [];

      /*
       * Generate a random eight-digit INTERNAL participant number.
       *
       * The number is stored only in sessionStorage so that refreshing the
       * page in the same browser tab keeps the same internal participant ID.
       * It is NOT a Prolific ID and cannot be linked back to a Prolific
       * account from the experiment data.
       */
      function generateRandomEightDigitId() {
        if (
          window.crypto &&
          window.crypto.getRandomValues
        ) {
          var randomValues =
            new Uint32Array(1);

          window.crypto.getRandomValues(
            randomValues
          );

          return String(
            10000000 +
            (
              randomValues[0] %
              90000000
            )
          );
        }

        return String(
          Math.floor(
            10000000 +
            Math.random() * 90000000
          )
        );
      }

      function getOrCreateInternalParticipantId() {
        var storageKey =
          "semantic_norming_des_secondround_internal_participant_id";

        try {
          var existingId =
            window.sessionStorage.getItem(
              storageKey
            );

          if (
            existingId &&
            /^[0-9]{8}$/.test(existingId)
          ) {
            return existingId;
          }

          var newId =
            generateRandomEightDigitId();

          window.sessionStorage.setItem(
            storageKey,
            newId
          );

          return newId;
        } catch (error) {
          return generateRandomEightDigitId();
        }
      }

      var participantId =
        getOrCreateInternalParticipantId();

      /*
       * Recruitment source
       * ------------------
       * Use the Prolific study URL with:
       *   ?source=prolific
       *
       * Use the personal-recruitment link with:
       *   ?source=personal
       *
       * The experiment NEVER reads or saves PROLIFIC_PID, STUDY_ID, or
       * SESSION_ID. The source flag is our own non-identifying label.
       *
       * Per the requested rule, anything other than source=prolific is
       * recorded as personal_recruitment.
       */
      var urlParameters =
        new URLSearchParams(
          window.location.search
        );

      var recruitmentSource =
        urlParameters.get("source") ===
          "prolific"
          ? "prolific"
          : "personal_recruitment";

      /*
       * Four-list counterbalancing
       * --------------------------
       * DataPipe must have condition assignment enabled for four
       * conditions. Its sequential values 0, 1, 2, and 3 map to A1, A2,
       * B1, and B2. Across twelve completed participants this gives three
       * participants per list and six participants per target version.
       *
       * For testing, append ?list=A1, ?list=A2, ?list=B1, or ?list=B2.
       * A URL-selected list takes precedence and does not request a new
       * DataPipe condition. Otherwise, the online assignment is cached in
       * sessionStorage so refreshing the page keeps the same list.
       */
      async function resolveExperimentalList() {
        var validLists = ["A1", "A2", "B1", "B2"];
        var requestedList =
          String(urlParameters.get("list") || "")
            .trim()
            .toUpperCase();

        if (requestedList !== "") {
          if (!validLists.includes(requestedList)) {
            throw new Error(
              'The URL parameter "list" must be A1, A2, B1, or B2.'
            );
          }

          return {
            list: requestedList,
            assignment_method: "url_parameter"
          };
        }

        if (IS_LOCAL_RUN) {
          return {
            list:
              validLists[
                Number(participantId) % validLists.length
              ],
            assignment_method:
              "local_internal_participant_id_modulo"
          };
        }

        var storageKey =
          "semantic_norming_des_secondround_experimental_list";

        try {
          var cachedList =
            window.sessionStorage.getItem(
              storageKey
            );

          if (validLists.includes(cachedList)) {
            return {
              list: cachedList,
              assignment_method:
                "datapipe_sequential_cached"
            };
          }
        } catch (error) {
          // Continue to DataPipe if sessionStorage is unavailable.
        }

        var response =
          await fetch(
            "https://pipe.jspsych.org/api/condition/",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body: JSON.stringify({
                experimentID:
                  DATAPIPE_EXPERIMENT_ID
              })
            }
          );

        var payload = {};

        try {
          payload = await response.json();
        } catch (error) {
          throw new Error(
            "DataPipe returned an unreadable condition-assignment response."
          );
        }

        if (!response.ok) {
          throw new Error(
            "Could not obtain a list assignment from DataPipe. " +
            (payload.message || "Unknown DataPipe error.") +
            " Confirm that condition assignment is enabled and " +
            "configured for four conditions."
          );
        }

        var conditionNumber =
          Number(payload.condition);

        if (
          !Number.isInteger(conditionNumber) ||
          conditionNumber < 0 ||
          conditionNumber > 3
        ) {
          throw new Error(
            "DataPipe returned condition " +
            String(payload.condition) +
            ". This experiment requires conditions 0-3."
          );
        }

        var assignedList =
          validLists[conditionNumber];

        try {
          window.sessionStorage.setItem(
            storageKey,
            assignedList
          );
        } catch (error) {
          // Assignment still works if sessionStorage is unavailable.
        }

        return {
          list: assignedList,
          assignment_method:
            "datapipe_sequential"
        };
      }

      var listAssignment =
        await resolveExperimentalList();

      var experimentalList =
        listAssignment.list;

      var targetVersion =
        experimentalList.charAt(0);

      var fillerRotation =
        experimentalList.charAt(1);

      var sessionTimestamp =
        new Date()
          .toISOString()
          .replace(/[^0-9]/g, "")
          .slice(0, 14);

      var dataFileStem =
        "semantic_norming_des_secondround_" +
        experimentalList +
        "_" +
        recruitmentSource +
        "_" +
        participantId +
        "_" +
        sessionTimestamp;

      /*
       * IMPORTANT: no Prolific IDs are stored.
       *
       * participant_id is the experiment's own random eight-digit number.
       * recruitment_source records only "prolific" or
       * "personal_recruitment".
       */
      jsPsych.data.addProperties({
        participant_id: participantId,
        recruitment_source:
          recruitmentSource,
        run_mode: RUN_MODE,
        session_timestamp_utc:
          sessionTimestamp,
        experimental_list:
          experimentalList,
        target_version:
          targetVersion,
        filler_rotation:
          fillerRotation,
        list_assignment_method:
          listAssignment.assignment_method,
        experiment_name:
          "semantic_norming_des_secondround"
      });


      // ==============================================================
      // 2. CSV FUNCTIONS
      // ==============================================================

      /*
       * Parse comma-delimited CSV, including:
       * - quoted fields
       * - commas inside quoted sentences
       * - doubled quotation marks
       *
       * In Excel, save the spreadsheet as:
       * CSV UTF-8 (Comma delimited) (.csv)
       */
      function parseCSV(csvText) {
        var rows = [];
        var row = [];
        var field = "";
        var insideQuotes = false;

        for (
          var index = 0;
          index < csvText.length;
          index++
        ) {
          var character = csvText[index];
          var nextCharacter = csvText[index + 1];

          if (character === '"') {
            if (
              insideQuotes &&
              nextCharacter === '"'
            ) {
              field += '"';
              index++;
            } else {
              insideQuotes = !insideQuotes;
            }
          } else if (
            character === "," &&
            !insideQuotes
          ) {
            row.push(field);
            field = "";
          } else if (
            (
              character === "\n" ||
              character === "\r"
            ) &&
            !insideQuotes
          ) {
            if (
              character === "\r" &&
              nextCharacter === "\n"
            ) {
              index++;
            }

            row.push(field);
            field = "";

            if (
              row.some(function(value) {
                return value.trim() !== "";
              })
            ) {
              rows.push(row);
            }

            row = [];
          } else {
            field += character;
          }
        }

        row.push(field);

        if (
          row.some(function(value) {
            return value.trim() !== "";
          })
        ) {
          rows.push(row);
        }

        return rows;
      }


      async function loadMainStimuli(filename) {
        var response =
          await fetch(
            filename,
            { cache: "no-store" }
          );

        if (!response.ok) {
          throw new Error(
            "Could not load " +
            filename +
            ". The server returned HTTP " +
            response.status +
            "."
          );
        }

        var csvText = await response.text();
        var parsedRows = parseCSV(csvText);

        if (parsedRows.length < 2) {
          throw new Error(
            filename +
            " must contain a header row and at least one stimulus row."
          );
        }

        var headers =
          parsedRows[0].map(function(header) {
            return header
              .replace(/^\uFEFF/, "")
              .trim();
          });

        if (
          headers.some(function(header) {
            return header === "";
          })
        ) {
          throw new Error(
            filename +
            " contains a blank column name."
          );
        }

        if (
          new Set(headers).size !==
          headers.length
        ) {
          throw new Error(
            filename +
            " contains duplicate column names."
          );
        }

        var requiredColumns = [
          "item_id",
          "lexical_item_id",
          "condition",
          "word",
          "sentence",
          "reading",
          "analysis_status",
          "stimulus_round",
          "target_version",
          "experimental_list",
          "original_version"
        ];

        requiredColumns.forEach(
          function(columnName) {
            if (!headers.includes(columnName)) {
              throw new Error(
                filename +
                ' is missing the required column "' +
                columnName +
                '".'
              );
            }
          }
        );

        var stimuli =
          parsedRows
            .slice(1)
            .map(function(values, rowIndex) {
              var item = {};

              headers.forEach(
                function(header, columnIndex) {
                  item[header] =
                    String(
                      values[columnIndex] || ""
                    ).trim();
                }
              );

              if (
                !item.item_id ||
                !item.lexical_item_id ||
                !item.condition ||
                !item.word ||
                !item.sentence ||
                !item.reading ||
                !item.analysis_status
              ) {
                throw new Error(
                  "CSV row " +
                  (rowIndex + 2) +
                  " has a blank required main-stimulus field."
                );
              }

              return item;
            });

        var itemIds =
          stimuli.map(function(item) {
            return item.item_id;
          });

        if (
          new Set(itemIds).size !==
          itemIds.length
        ) {
          throw new Error(
            filename +
            " contains duplicate item_id values."
          );
        }

        return {
          headers: headers,
          stimuli: stimuli
        };
      }


      async function loadPracticeStimuli(filename) {
        var response =
          await fetch(
            filename,
            { cache: "no-store" }
          );

        if (!response.ok) {
          throw new Error(
            "Could not load " +
            filename +
            ". The server returned HTTP " +
            response.status +
            "."
          );
        }

        var csvText = await response.text();
        var parsedRows = parseCSV(csvText);

        if (parsedRows.length !== 4) {
          throw new Error(
            filename +
            " must contain exactly three practice rows plus one header row."
          );
        }

        var headers =
          parsedRows[0].map(function(header) {
            return header
              .replace(/^\uFEFF/, "")
              .trim();
          });

        var requiredColumns = [
          "item_id",
          "word",
          "sentence",
          "accepted_ratings",
          "correct_feedback",
          "incorrect_feedback"
        ];

        requiredColumns.forEach(
          function(columnName) {
            if (!headers.includes(columnName)) {
              throw new Error(
                filename +
                ' is missing the required column "' +
                columnName +
                '".'
              );
            }
          }
        );

        var stimuli =
          parsedRows
            .slice(1)
            .map(function(values, rowIndex) {
              var item = {};

              headers.forEach(
                function(header, columnIndex) {
                  item[header] =
                    String(
                      values[columnIndex] || ""
                    ).trim();
                }
              );

              if (
                !item.item_id ||
                !item.word ||
                !item.sentence ||
                !item.accepted_ratings ||
                !item.correct_feedback ||
                !item.incorrect_feedback
              ) {
                throw new Error(
                  "CSV row " +
                  (rowIndex + 2) +
                  " has a blank required practice field."
                );
              }

              var acceptedRatings =
                item.accepted_ratings
                  .split("|")
                  .map(function(value) {
                    return Number(
                      value.trim()
                    );
                  });

              if (
                acceptedRatings.length === 0 ||
                acceptedRatings.some(
                  function(value) {
                    return (
                      !Number.isInteger(value) ||
                      value < 1 ||
                      value > 7
                    );
                  }
                )
              ) {
                throw new Error(
                  "CSV row " +
                  (rowIndex + 2) +
                  ' has invalid accepted_ratings. Use values such as "5|6|7".'
                );
              }

              item.accepted_ratings =
                acceptedRatings.join("|");

              return item;
            });

        var itemIds =
          stimuli.map(function(item) {
            return item.item_id;
          });

        if (
          new Set(itemIds).size !==
          itemIds.length
        ) {
          throw new Error(
            filename +
            " contains duplicate practice item_id values."
          );
        }

        return stimuli;
      }


      /*
       * Select one of four preconstructed lists from the master CSV.
       * A1 and A2 share target Version A but use different old-item
       * rotations; B1 and B2 contain the complementary target readings.
       */
      function selectAndValidateExperimentalList(
        stimuli,
        assignedList
      ) {
        var assignedTargetVersion =
          assignedList.charAt(0);

        var newTargets =
          stimuli.filter(function(item) {
            return (
              item.stimulus_round ===
                "new_high_des" &&
              item.target_version ===
                assignedTargetVersion
            );
          });

        var oldFillers =
          stimuli.filter(function(item) {
            return (
              item.stimulus_round ===
                "first_round_retest" &&
              item.experimental_list ===
                assignedList
            );
          });

        var selectedStimuli =
          newTargets
            .concat(oldFillers)
            .map(function(item) {
              return Object.assign(
                {},
                item,
                {
                  target_version:
                    assignedTargetVersion,
                  experimental_list:
                    assignedList,
                  filler_rotation:
                    assignedList.charAt(1)
                }
              );
            });

        var expectedFillerCount =
          assignedList.endsWith("1")
            ? 68
            : 67;

        var expectedTotal =
          74 + expectedFillerCount;

        if (newTargets.length !== 74) {
          throw new Error(
            "List " + assignedList +
            " must contain 74 new high_des targets. Found " +
            newTargets.length + "."
          );
        }

        if (oldFillers.length !== expectedFillerCount) {
          throw new Error(
            "List " + assignedList +
            " must contain " + expectedFillerCount +
            " old fillers. Found " + oldFillers.length + "."
          );
        }

        if (selectedStimuli.length !== expectedTotal) {
          throw new Error(
            "List " + assignedList +
            " must contain " + expectedTotal +
            " total trials. Found " +
            selectedStimuli.length + "."
          );
        }

        var lexicalIds =
          selectedStimuli.map(function(item) {
            return item.lexical_item_id;
          });

        if (
          new Set(lexicalIds).size !==
          lexicalIds.length
        ) {
          throw new Error(
            "List " + assignedList +
            " contains both readings of at least one word."
          );
        }

        var targetHighCount =
          newTargets.filter(function(item) {
            return item.reading === "high";
          }).length;

        var targetLowCount =
          newTargets.filter(function(item) {
            return item.reading === "low";
          }).length;

        if (
          targetHighCount !== 37 ||
          targetLowCount !== 37
        ) {
          throw new Error(
            "List " + assignedList +
            " must contain 37 high and 37 low new readings."
          );
        }

        var expectedConditionCounts = {
          A1: {
            high_in: 23,
            low_des: 23,
            high_des: 22
          },
          A2: {
            high_in: 22,
            low_des: 22,
            high_des: 23
          },
          B1: {
            high_in: 23,
            low_des: 22,
            high_des: 23
          },
          B2: {
            high_in: 22,
            low_des: 23,
            high_des: 22
          }
        };

        [
          "high_in",
          "low_des",
          "high_des"
        ].forEach(function(conditionName) {
          var observedCount =
            oldFillers.filter(function(item) {
              return item.condition ===
                conditionName;
            }).length;

          var expectedCount =
            expectedConditionCounts[
              assignedList
            ][conditionName];

          if (observedCount !== expectedCount) {
            throw new Error(
              "List " + assignedList +
              " should contain " + expectedCount +
              " old " + conditionName +
              " items. Found " + observedCount + "."
            );
          }
        });

        if (
          oldFillers.some(function(item) {
            return item.condition === "low_re";
          })
        ) {
          throw new Error(
            "The second-round lists must not contain low_re items."
          );
        }

        return selectedStimuli;
      }


      /*
       * Divide 141 or 142 selected trials into four near-equal blocks.
       * Strata defined by round, condition, and analysis status are spread
       * across blocks before trial order is randomized within each block.
       */
      function divideIntoFourBalancedBlocks(
        stimuli
      ) {
        var baseSize =
          Math.floor(stimuli.length / 4);

        var remainder =
          stimuli.length % 4;

        var capacities = [0, 1, 2, 3]
          .map(function(blockIndex) {
            return (
              baseSize +
              (blockIndex < remainder ? 1 : 0)
            );
          });

        var blocks = [[], [], [], []];
        var stratumCounts = [{}, {}, {}, {}];
        var strata = {};

        stimuli.forEach(function(item) {
          var stratumKey =
            item.stimulus_round + "|" +
            item.condition + "|" +
            item.analysis_status;

          if (!strata[stratumKey]) {
            strata[stratumKey] = [];
          }

          strata[stratumKey].push(item);
        });

        var stratumKeys =
          jsPsych.randomization.shuffle(
            Object.keys(strata)
          );

        stratumKeys.forEach(function(stratumKey) {
          var stratumItems =
            jsPsych.randomization.shuffle(
              strata[stratumKey].slice()
            );

          stratumItems.forEach(function(item) {
            var candidates =
              jsPsych.randomization.shuffle(
                [0, 1, 2, 3]
              )
              .filter(function(blockIndex) {
                return (
                  blocks[blockIndex].length <
                  capacities[blockIndex]
                );
              });

            candidates.sort(function(first, second) {
              var firstStratumCount =
                stratumCounts[first][stratumKey] || 0;
              var secondStratumCount =
                stratumCounts[second][stratumKey] || 0;

              return (
                firstStratumCount -
                  secondStratumCount ||
                blocks[first].length -
                  blocks[second].length
              );
            });

            var selectedBlock = candidates[0];

            blocks[selectedBlock].push(item);
            stratumCounts[selectedBlock][stratumKey] =
              (stratumCounts[selectedBlock][stratumKey] || 0) + 1;
          });
        });

        var overallOrder = 1;

        return blocks.map(
          function(blockItems, blockIndex) {
            if (
              blockItems.length !==
              capacities[blockIndex]
            ) {
              throw new Error(
                "Block " + (blockIndex + 1) +
                " should contain " +
                capacities[blockIndex] +
                " trials, but contains " +
                blockItems.length + "."
              );
            }

            var lexicalIdsInBlock =
              blockItems.map(function(item) {
                return item.lexical_item_id;
              });

            if (
              new Set(lexicalIdsInBlock).size !==
              lexicalIdsInBlock.length
            ) {
              throw new Error(
                "Block " + (blockIndex + 1) +
                " repeats a lexical item."
              );
            }

            var shuffledBlock =
              jsPsych.randomization.shuffle(
                blockItems.slice()
              );

            return shuffledBlock.map(
              function(item, itemIndex) {
                var orderedItem =
                  Object.assign(
                    {},
                    item,
                    {
                      experimental_block:
                        blockIndex + 1,
                      block_trial:
                        itemIndex + 1,
                      randomized_trial_order:
                        overallOrder
                    }
                  );

                overallOrder++;
                return orderedItem;
              }
            );
          }
        );
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");

      function makeRatingHtml(word, sentence) {
        var buttons = "";

        for (

          rating <= 7;
          rating++

          buttons +=
            '<button ' +

              'class="rating-button" ' +
              'data-rating="' +
              rating +
              '" ' +
              'aria-label="Rating ' +
              rating +
              '">' +
              rating +
            "</button>";
        }

        return `
          <div class="rating-trial">

            <div class="rating-word">
              ${escapeHtml(word)}
            </div>

            <div class="rating-sentence">
              ${escapeHtml(sentence)}
            </div>
            <div
              class="rating-scale"

              aria-label="Escala de avaliação de sete pontos"

      function activateRatingButtons() {

        var buttons =

              buttons.forEach(

                  currentButton.disabled = true;

              );

              jsPsych.finishTrial({
                response: String(rating),
                rating: rating,
                response_method: "button",
                rt:
                  performance.now() -
                  buttonStartTime
              });
            },
            { once: true }
          );
        });
      }

      function configureConditionalSurveySection(
        controllingName,
        visibleValue,
        containerId
      ) {
        var controls =
          document.querySelectorAll(
            'input[name="' +
            controllingName +
            '"]'
          );

        var container =
          document.getElementById(
            containerId
          );

        function updateSection() {
          var selected =
            document.querySelector(
              'input[name="' +
              controllingName +
              '"]:checked'
            );

          var shouldShow =
            selected &&
            selected.value === visibleValue;

          container.classList.toggle(
            "visible",
            Boolean(shouldShow)
          );

          container
            .querySelectorAll(
              "input, select, textarea"
            )
            .forEach(function(control) {
              control.disabled =
                !shouldShow;

              control.required =
                Boolean(shouldShow) &&
                control.dataset
                  .requiredWhenVisible ===
                  "true";

              if (!shouldShow) {
                if (
                  control.type === "radio" ||
                  control.type === "checkbox"
                ) {
                  control.checked = false;
                } else {
                  control.value = "";
                }
              }
            });
        }

        controls.forEach(function(control) {
          control.addEventListener(
            "change",
            updateSection
          );
        });

        updateSection();
      }


      function activateLanguageBackgroundSurvey() {
        var surveyStartTime =
          performance.now();

        configureConditionalSurveySection(
          "gender",
          "Other",
          "gender-other-details"
        );

        configureConditionalSurveySection(
          "home_other_language",
          "yes",
          "home-language-details"
        );

        configureConditionalSurveySection(
          "school_work_other_language",
          "yes",
          "school-work-language-details"
        );

        configureConditionalSurveySection(
          "lived_other_language_places",
          "yes",
          "other-language-places-details"
        );

        var form =
          document.getElementById(
            "language-background-form"
          );

        var submitButton =
          document.getElementById(
            "language-survey-submit"
          );

        /*
        * Prevent Enter inside a questionnaire field from
        * submitting the form accidentally.
        *
        * Enter remains available inside textareas so that
        * participants can create a new line.
        */
        form.addEventListener(
          "keydown",
          function(event) {
            /*
             * Keep typing inside the questionnaire from reaching
             * jsPsych's document-level keyboard listener.
             */
            event.stopPropagation();

            if (
              event.key === "Enter" &&
              event.target.tagName !== "TEXTAREA"
            ) {
              event.preventDefault();
            }
          }
        );

        form.addEventListener(
          "keyup",
          function(event) {
            event.stopPropagation();
          }
        );

        submitButton.addEventListener(
          "click",
          function() {
            /*
            * Do not continue until all required fields
            * have valid responses.
            */
            if (!form.reportValidity()) {
              return;
            }

            /*
            * Prevent repeated clicks while the trial
            * is being completed.
            */
            submitButton.disabled = true;
            submitButton.textContent =
              "Enviando questionário...";

            var formData =
              new FormData(form);

            var trialData = {
              task:
                "language_background_survey",

              phase:
                "post_experiment_survey",

              language_survey_rt:
                Math.round(
                  performance.now() -
                  surveyStartTime

            [
              "gender",
              "gender_other",
              "age",
              "education",
              "daily_languages",
              "home_other_language",
              "home_languages",
              "home_exposure_years",

                "language_" + fieldName
              ] =
                formData.get(fieldName) || "";
            });

            jsPsych.finishTrial(
              trialData
            );
          }
        );
      }
