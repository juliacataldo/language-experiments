  <script>
    async function startExperiment() {
    // ================================================================
    // 1. GENERAL SETTINGS
    // ================================================================

    /*
     * Continuous lexical-decision timing.
     *
     * Every spreadsheet row is one prime-target pair. Both the prime and the
     * target become ordinary lexical-decision trials, so the participant must
     * press F or J for every displayed letter string.
     *
     * Trial sequence:
     *   fixation: 500 ms
     *   blank:    200 ms
     *   stimulus: 550 ms (responses remain possible after it disappears)
     *   response deadline: 2000 ms from stimulus onset
     *   post-response interval: randomly 650, 700, or 750 ms
     */
    var FIXATION_DURATION_MS = 500;
    var PRE_STIMULUS_BLANK_MS = 200;
    var STIMULUS_DURATION_MS = 550;
    var RESPONSE_DEADLINE_MS = 2000;
    var ITI_OPTIONS_MS = [650, 700, 750];
    var FEEDBACK_DURATION_MS = 750;
    var PRACTICE_PASS_THRESHOLD = 0.80;

    var STIMULUS_ONSET_MS =
      FIXATION_DURATION_MS + PRE_STIMULUS_BLANK_MS;

    /*
     * Upload the approved consent PDF to the same folder as this file
     * and name it consent.pdf.
     */
    var CONSENT_PDF_FILE = "consent.pdf";

    /*
     * Keep main_stimuli_continuous.csv in the same folder as this HTML file.
     * Each row of that CSV must describe one complete prime-target pair.
     */
    var MAIN_STIMULI_FILE = "main_stimuli_continuous.csv";
    var DATAPIPE_EXPERIMENT_ID = "0Zb0XHTy8RcV";

    /*
     * Automatic run-mode selection:
     * - localhost / 127.0.0.1 / 0.0.0.0 -> local Python saving
     * - every other hostname (including GitHub Pages) -> DataPipe saving
     */
    var LOCAL_HOSTNAMES = ["localhost", "127.0.0.1", "0.0.0.0"];
    var IS_LOCAL_RUN =
      LOCAL_HOSTNAMES.includes(window.location.hostname);
    var RUN_MODE = IS_LOCAL_RUN ? "local" : "online_datapipe";

    if (window.location.protocol === "file:") {
      throw new Error(
        "This version loads its stimuli from " + MAIN_STIMULI_FILE + ". " +
        "Please run it through the Python server at " +
        "http://localhost:8000/ rather than double-clicking the HTML file."
      );
    }

    if (
      !IS_LOCAL_RUN &&
      DATAPIPE_EXPERIMENT_ID ===
        "PASTE_YOUR_DATAPIPE_EXPERIMENT_ID_HERE"
    ) {
      throw new Error(
        "Online saving is not configured yet. Replace " +
        "PASTE_YOUR_DATAPIPE_EXPERIMENT_ID_HERE with the Experiment ID " +
        "shown in your DataPipe experiment dashboard."
      );
    }

    var jsPsych = initJsPsych({
      show_progress_bar: true,
      auto_update_progress_bar: false,
      message_progress_bar: "Experiment progress"
    });

    var timeline = [];

    function generateRandomEightDigitId() {
      if (window.crypto && window.crypto.getRandomValues) {
        var randomValues = new Uint32Array(1);
        window.crypto.getRandomValues(randomValues);

        return String(
          10000000 + (randomValues[0] % 90000000)
        );
      }

      return String(
        Math.floor(10000000 + Math.random() * 90000000)
      );
    }

    var participantId = generateRandomEightDigitId();

    var sessionTimestamp = new Date()
      .toISOString()
      .replace(/[^0-9]/g, "")
      .slice(0, 14);

    var dataFileStem =
      "continuous_lexical_decision_" +
      participantId +
      "_" +
      sessionTimestamp;

    jsPsych.data.addProperties({
      participant_id: participantId,
      run_mode: RUN_MODE,
      session_timestamp_utc: sessionTimestamp,
      experiment_paradigm: "continuous_lexical_decision",
      prime_target_lag_trials: 1
    });


    // ================================================================
    // 2. HELPER FUNCTIONS
    // ================================================================

    function makePsychophysicsText(
      content,
      showStartTime,
      showEndTime,
      fontSize
    ) {
      var stimulus = {
        obj_type: "text",
        content: content,
        startX: 0,
        startY: 0,
        origin_center: true,
        fontSize: fontSize || "48px",
        fontFamily: "Courier New, Courier, monospace",
        fontWeight: "bold",
        text_color: "#ffffff",
        show_start_time: showStartTime
      };

      if (showEndTime !== undefined) {
        stimulus.show_end_time = showEndTime;
      }

      return stimulus;
    }

    function calculateAccuracy(dataCollection) {
      var total = dataCollection.count();

      if (total === 0) {
        return 0;
      }

      var numberCorrect =
        dataCollection.filter({ correct: true }).count();

      return numberCorrect / total;
    }

    function chooseRandomValue(values) {
      return values[
        Math.floor(Math.random() * values.length)
      ];
    }

    /*
     * Parse an ordinary comma-delimited CSV, including quoted fields and
     * commas inside quoted fields. Save the spreadsheet from Excel as
     * "CSV UTF-8 (Comma delimited)".
     */
    function parseCSV(csvText) {
      var rows = [];
      var row = [];
      var field = "";
      var insideQuotes = false;

      for (var index = 0; index < csvText.length; index++) {
        var character = csvText[index];
        var nextCharacter = csvText[index + 1];

        if (character === '"') {
          if (insideQuotes && nextCharacter === '"') {
            field += '"';
            index++;
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (character === "," && !insideQuotes) {
          row.push(field);
          field = "";
        } else if (
          (character === "\n" || character === "\r") &&
          !insideQuotes
        ) {
          if (character === "\r" && nextCharacter === "\n") {
            index++;
          }

          row.push(field);
          field = "";

          if (row.some(function(value) { return value.trim() !== ""; })) {
            rows.push(row);
          }

          row = [];
        } else {
          field += character;
        }
      }

      row.push(field);
      if (row.some(function(value) { return value.trim() !== ""; })) {
        rows.push(row);
      }

      return rows;
    }

    async function loadMainPairs(filename) {
      var response = await fetch(filename, { cache: "no-store" });

      if (!response.ok) {
        throw new Error(
          "Could not load " + filename +
          ". The server returned HTTP " + response.status + "."
        );
      }

      var csvText = await response.text();
      var parsedRows = parseCSV(csvText);

      if (parsedRows.length < 2) {
        throw new Error(
          filename + " must contain a header row and at least one pair."
        );
      }

      var headers = parsedRows[0].map(function(header) {
        return header.replace(/^\uFEFF/, "").trim();
      });

      if (headers.some(function(header) { return header === ""; })) {
        throw new Error(
          filename + " contains a blank column name in its first row."
        );
      }

      if (new Set(headers).size !== headers.length) {
        throw new Error(
          filename + " contains duplicate column names."
        );
      }

      var requiredColumns = [
        "pair_id",
        "condition",
        "prime_item_id",
        "prime",
        "prime_lexicality",
        "prime_correct_response",
        "target_item_id",
        "target",
        "target_lexicality",
        "target_correct_response"
      ];

      requiredColumns.forEach(function(columnName) {
        if (!headers.includes(columnName)) {
          throw new Error(
            filename + " is missing the required column \"" +
            columnName + "\"."
          );
        }
      });

      var pairs = parsedRows.slice(1).map(function(values, rowIndex) {
        var pair = {};

        headers.forEach(function(header, columnIndex) {
          pair[header] = String(values[columnIndex] || "").trim();
        });

        pair.prime_lexicality = pair.prime_lexicality.toLowerCase();
        pair.target_lexicality = pair.target_lexicality.toLowerCase();
        pair.prime_correct_response =
          pair.prime_correct_response.toLowerCase();
        pair.target_correct_response =
          pair.target_correct_response.toLowerCase();

        [
          "pair_id",
          "condition",
          "prime_item_id",
          "prime",
          "target_item_id",
          "target"
        ].forEach(function(columnName) {
          if (!pair[columnName]) {
            throw new Error(
              "CSV row " + (rowIndex + 2) +
              " has a blank value in \"" + columnName + "\"."
            );
          }
        });

        ["prime_lexicality", "target_lexicality"].forEach(
          function(columnName) {
            if (!['word', 'nonword'].includes(pair[columnName])) {
              throw new Error(
                "CSV row " + (rowIndex + 2) +
                " has " + columnName + " \"" + pair[columnName] +
                "\". Use word or nonword."
              );
            }
          }
        );

        ["prime_correct_response", "target_correct_response"].forEach(
          function(columnName) {
            if (!["f", "j"].includes(pair[columnName])) {
              throw new Error(
                "CSV row " + (rowIndex + 2) +
                " has " + columnName + " \"" + pair[columnName] +
                "\". Use f or j."
              );
            }
          }
        );

        return pair;
      });

      var pairIds = pairs.map(function(pair) { return pair.pair_id; });
      if (new Set(pairIds).size !== pairIds.length) {
        throw new Error(
          filename + " contains duplicate pair_id values."
        );
      }

      var itemIds = [];
      pairs.forEach(function(pair) {
        itemIds.push(pair.prime_item_id, pair.target_item_id);
      });

      if (new Set(itemIds).size !== itemIds.length) {
        throw new Error(
          filename + " contains duplicate prime_item_id or target_item_id values."
        );
      }

      return {
        headers: headers,
        pairs: pairs
      };
    }

    /*
     * Shuffle complete prime-target pairs and divide the pairs into four
     * blocks. Prime and target are never separated or independently shuffled.
     */
    function dividePairsIntoFourBlocks(pairs) {
      if (pairs.length < 4) {
        throw new Error(
          "The main spreadsheet must contain at least four prime-target pairs."
        );
      }

      var shuffledPairs =
        jsPsych.randomization.shuffle(pairs.slice());

      var blocks = [[], [], [], []];
      var baseBlockSize = Math.floor(shuffledPairs.length / 4);
      var remainder = shuffledPairs.length % 4;
      var pairIndex = 0;
      var overallPairOrder = 1;
      var overallTrialOrder = 1;

      for (var blockIndex = 0; blockIndex < 4; blockIndex++) {
        var thisBlockSize =
          baseBlockSize + (blockIndex < remainder ? 1 : 0);
        var blockTrialNumber = 1;

        for (
          var blockPairPosition = 1;
          blockPairPosition <= thisBlockSize;
          blockPairPosition++
        ) {
          var pair = shuffledPairs[pairIndex];

          var sharedOrderData = {
            experimental_block: blockIndex + 1,
            block_pair_position: blockPairPosition,
            randomized_pair_order: overallPairOrder
          };

          var primeTrial = Object.assign({}, pair, sharedOrderData, {
            pair_role: "prime",
            pair_trial_position: 1,
            item_id: pair.prime_item_id,
            stimulus: pair.prime,
            lexicality: pair.prime_lexicality,
            correct_response: pair.prime_correct_response,
            paired_item_id: pair.target_item_id,
            paired_stimulus: pair.target,
            block_trial: blockTrialNumber,
            randomized_trial_order: overallTrialOrder,
            iti_duration_ms: chooseRandomValue(ITI_OPTIONS_MS)
          });

          blockTrialNumber++;
          overallTrialOrder++;

          var targetTrial = Object.assign({}, pair, sharedOrderData, {
            pair_role: "target",
            pair_trial_position: 2,
            item_id: pair.target_item_id,
            stimulus: pair.target,
            lexicality: pair.target_lexicality,
            correct_response: pair.target_correct_response,
            paired_item_id: pair.prime_item_id,
            paired_stimulus: pair.prime,
            block_trial: blockTrialNumber,
            randomized_trial_order: overallTrialOrder,
            iti_duration_ms: chooseRandomValue(ITI_OPTIONS_MS)
          });

          blockTrialNumber++;
          overallTrialOrder++;

          blocks[blockIndex].push(primeTrial, targetTrial);

          pairIndex++;
          overallPairOrder++;
        }
      }

      return blocks;
    }

    // ================================================================
    // 3. CONSENT SCREEN
    // ================================================================

    /*
     * The consent form is displayed from consent.pdf. Upload that PDF to
     * the same folder as exp2.html.
     */
    var consent_screen = {
      type: jsPsychHtmlKeyboardResponse,

      stimulus: `
        <div class="text-screen">
          <h1>Welcome to this experiment!</h1>

          <p>
            Please read the consent form below before deciding whether
            you would like to participate.
          </p>

          <iframe
            src="${CONSENT_PDF_FILE}"
            title="Research consent form"
            style="
              width:100%;
              height:65vh;
              border:1px solid rgba(255,255,255,0.65);
              background:white;
            "
          ></iframe>

          <p style="text-align:center;">
            <a
              href="${CONSENT_PDF_FILE}"
              target="_blank"
              rel="noopener"
              style="color:white;text-decoration:underline;"
            >
              Open the consent form in a new tab
            </a>
          </p>

          <p class="continue-prompt">
            If you have read the consent form and agree to participate,
            select <strong>I agree and wish to continue</strong>.
          </p>

          <p class="continue-prompt">
            If you do not agree to participate, select
            <strong>I do not agree</strong>.
          </p>

          <div style="
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:16px;
            margin-top:24px;
          ">
            <button
              id="consent-accept"
              type="button"
              style="font-size:18px;padding:12px 18px;cursor:pointer;"
            >
              I agree and wish to continue
            </button>

            <button
              id="consent-decline"
              type="button"
              style="font-size:18px;padding:12px 18px;cursor:pointer;"
            >
              I do not agree
            </button>
          </div>
        </div>
      `,

      choices: ["c", "x"],

      data: {
        task: "consent"
      },

      on_load: function() {
        document
          .getElementById("consent-accept")
          .addEventListener(
            "click",
            function() {
              jsPsych.finishTrial({
                response: "c",
                response_method: "button"
              });
            },
            { once: true }
          );

        document
          .getElementById("consent-decline")
          .addEventListener(
            "click",
            function() {
              jsPsych.finishTrial({
                response: "x",
                response_method: "button"
              });
            },
            { once: true }
          );
      },

      on_finish: function(data) {
        data.consent_given =
          jsPsych.pluginAPI.compareKeys(
            data.response,
            "c"
          );

        if (!data.response_method) {
          data.response_method =
            "keyboard";
        }

        if (!data.consent_given) {
          jsPsych.abortExperiment(
            "<p>Thank you for your interest! You chose not to participate. " +
            "You may close this window.</p>"
          );
        }
      }
    };

    timeline.push(consent_screen);


    // ================================================================
    // 4. TASK INSTRUCTIONS
    // ================================================================

    var instructions_screen = {
      type: jsPsychHtmlKeyboardResponse,

      stimulus: `
        <div class="text-screen">
          <h1>Instructions</h1>

          <p>
            In this experiment, letter strings will appear one after another.
            You must make a lexical decision for <strong>every</strong> string.
          </p>

          <p>
            Respond as quickly and accurately as possible:
          </p>

          <ul>
            <li>
              Real Portuguese word: press <strong>J</strong> with your
              <strong>right index finger</strong>.
            </li>

            <li>
              Not a real Portuguese word: press <strong>F</strong> with your
              <strong>left index finger</strong>.
            </li>
          </ul>

          <p>
            Each trial begins with a fixation cross. The letter string is
            displayed briefly, and you may respond as soon as it appears.
          </p>

          <p>
            Keep your index fingers on F and J throughout the task. The main
            experiment is divided into four blocks, with three breaks.
          </p>

          <p>
            After the task, you will complete a language-background survey.
          </p>

          <p class="continue-prompt">
            Press any key to continue to the practice.
          </p>
        </div>
      `,

      data: {
        task: "instructions"
      }
    };

    timeline.push(instructions_screen);


    // ================================================================
    // 5. PRACTICE STIMULI
    // ================================================================

    /*
     * Practice is organized as three consecutive pairs, but every member of
     * every pair receives its own F/J response.
     */
    var practice_stimuli = [
      {
        pair_id: "practice_pair_01",
        pair_role: "prime",
        pair_trial_position: 1,
        item_id: "practice_01",
        stimulus: "CASA",
        lexicality: "word",
        correct_response: "j",
        paired_item_id: "practice_02",
        condition: "practice"
      },
      {
        pair_id: "practice_pair_01",
        pair_role: "target",
        pair_trial_position: 2,
        item_id: "practice_02",
        stimulus: "LIVRO",
        lexicality: "word",
        correct_response: "j",
        paired_item_id: "practice_01",
        condition: "practice"
      },
      {
        pair_id: "practice_pair_02",
        pair_role: "prime",
        pair_trial_position: 1,
        item_id: "practice_03",
        stimulus: "PUFRA",
        lexicality: "nonword",
        correct_response: "f",
        paired_item_id: "practice_04",
        condition: "practice"
      },
      {
        pair_id: "practice_pair_02",
        pair_role: "target",
        pair_trial_position: 2,
        item_id: "practice_04",
        stimulus: "VERDE",
        lexicality: "word",
        correct_response: "j",
        paired_item_id: "practice_03",
        condition: "practice"
      },
      {
        pair_id: "practice_pair_03",
        pair_role: "prime",
        pair_trial_position: 1,
        item_id: "practice_05",
        stimulus: "DALTE",
        lexicality: "nonword",
        correct_response: "f",
        paired_item_id: "practice_06",
        condition: "practice"
      },
      {
        pair_id: "practice_pair_03",
        pair_role: "target",
        pair_trial_position: 2,
        item_id: "practice_06",
        stimulus: "NIMPO",
        lexicality: "nonword",
        correct_response: "f",
        paired_item_id: "practice_05",
        condition: "practice"
      }
    ];


    // ================================================================
    // 6. PRACTICE TRIAL SEQUENCE
    // ================================================================

    var practice_intro = {
      type: jsPsychHtmlKeyboardResponse,

      stimulus: `
        <div class="text-screen">
          <h1>Practice</h1>

          <p>
            You will now complete six practice trials.
          </p>

          <p>
            Respond to every letter string. After each response, you will
            receive feedback.
          </p>

          <p>
            Press <strong>J</strong> for a real word and <strong>F</strong>
            for a nonword.
          </p>

          <p class="continue-prompt">
            Press any key to begin the practice.
          </p>
        </div>
      `,

      data: {
        task: "practice_instructions"
      }
    };

    timeline.push(practice_intro);

    var practice_continuous_trial = {
      type: jsPsychPsychophysics,

      stimuli: [
        makePsychophysicsText(
          "+",

        if (lastTarget.missed_response) {

    function configureConditionalSurveySection(
      controllingName,
      visibleValue,
      containerId
    ) {
      var controls =
        document.querySelectorAll(
          'input[name="' +
          controllingName +
          '"]'
        );

      var container =
        document.getElementById(
          containerId
        );

      function updateSection() {
        var selected =
          document.querySelector(
            'input[name="' +
            controllingName +
            '"]:checked'
          );

        var shouldShow =
          selected &&
          selected.value === visibleValue;

        container.classList.toggle(
          "visible",
          Boolean(shouldShow)
        );

        container
          .querySelectorAll(
            "input, select, textarea"
          )
          .forEach(function(control) {
            control.disabled =
              !shouldShow;

            control.required =
              Boolean(shouldShow) &&
              control.dataset
                .requiredWhenVisible ===
                "true";

            if (!shouldShow) {
              if (
                control.type === "radio" ||
                control.type === "checkbox"
              ) {
                control.checked = false;
              } else {
                control.value = "";
              }
            }
          });
      }

      controls.forEach(function(control) {
        control.addEventListener(
          "change",
          updateSection
        );
      });

      updateSection();
    }


    function activateLanguageBackgroundSurvey() {
      var surveyStartTime =
        performance.now();

      configureConditionalSurveySection(
        "gender",
        "Other",
        "gender-other-details"
      );

      configureConditionalSurveySection(
        "home_other_language",
        "yes",
        "home-language-details"
      );

      configureConditionalSurveySection(
        "school_work_other_language",
        "yes",
        "school-work-language-details"
      );

      configureConditionalSurveySection(
        "lived_other_language_places",
        "yes",
        "other-language-places-details"
      );

      var form =
        document.getElementById(
          "language-background-form"
        );

      var submitButton =
        document.getElementById(
          "language-survey-submit"
        );

      /*
      * Prevent Enter inside a questionnaire field from
      * submitting the form accidentally.
      *
      * Enter remains available inside textareas so that
      * participants can create a new line.
      */
      form.addEventListener(
        "keydown",
        function(event) {
          if (
            event.key === "Enter" &&
            event.target.tagName !== "TEXTAREA"
          ) {
            event.preventDefault();
          }
        }
      );

      submitButton.addEventListener(
        "click",
        function() {
          /*
          * Do not continue until all required fields
          * have valid responses.
          */
          if (!form.reportValidity()) {
            return;
          }

          /*
          * Prevent repeated clicks while the trial
          * is being completed.
          */
          submitButton.disabled = true;
          submitButton.textContent =
            "Submitting questionnaire...";

          var formData =
            new FormData(form);

          var trialData = {
            task:
              "language_background_survey",

            phase:
              "post_experiment_survey",

            language_survey_rt:
              Math.round(
                performance.now() -
                surveyStartTime
              )
          };

          [
            "gender",
            "gender_other",
            "age",
            "education",
            "daily_languages",
            "home_other_language",
            "home_languages",
            "home_exposure_years",
            "home_relative_use",
            "school_work_other_language",
            "school_work_languages",
            "school_work_exposure_years",
            "school_work_relative_use",
            "brazil_growing_up_years",
            "current_country",
            "current_country_years",
            "lived_other_language_places",
            "other_language_places",
            "language_background_comments"
          ].forEach(function(fieldName) {
            trialData[
              "language_" + fieldName
            ] =
              formData.get(fieldName) || "";
          });

          jsPsych.finishTrial(
            trialData
          );
        }
      );
    }


    var languageBackgroundSurvey = {
      type:
        jsPsychHtmlKeyboardResponse,

      stimulus:
        languageBackgroundSurveyHtml,

      choices:
        "NO_KEYS",

      on_load:
        activateLanguageBackgroundSurvey,

      data: {
        task:
          "language_background_survey"
      }
    };

    timeline.push(
      languageBackgroundSurvey
    );


    // ================================================================
    // 12. SAVE DATA: LOCAL PYTHON OR ONLINE DATAPIPE
    // ================================================================

    if (IS_LOCAL_RUN) {
      /*
       * LOCAL MODE
       * Open through http://localhost:8000/. The existing saveData.js sends
       * the CSV to serve.py, which writes it into the local ./data/ folder.
       */
      var local_save_block = {
        type: jsPsychHtmlKeyboardResponse,

        stimulus:
          '<p style="font-size: 24px;">' +
          'Saving your data locally...' +
          '</p>',

        choices: "NO_KEYS",

        on_load: function() {
          var csvData =
            jsPsych.data
              .get()
              .ignore("stimulus")
              .csv();

          saveData(dataFileStem, csvData)
            .then(function() {
              var displayElement =
                document.querySelector("#jspsych-content") ||
                jsPsych.getDisplayElement();

              displayElement.innerHTML =
                '<p style="font-size: 24px;">' +
                'Data saved successfully in the local data folder.' +
                '</p>' +
                '<p>You can close this window.</p>';
            })
            .catch(function(error) {
              console.error("Local data-saving error:", error);

              var displayElement =
                document.querySelector("#jspsych-content") ||
                jsPsych.getDisplayElement();

              displayElement.innerHTML =
                '<p style="font-size: 24px;">' +
                'The local data could not be saved.' +
                '</p>' +
                '<p>' + error.message + '</p>';
            });
        }
      };

      timeline.push(local_save_block);
    } else {
      /*
       * ONLINE MODE
       * GitHub Pages serves the experiment. jsPsychPipe sends the complete
       * CSV to the OSF component connected to the DataPipe Experiment ID.
       */
      var datapipe_save_trial = {
        type: jsPsychPipe,
        action: "save",
        experiment_id: DATAPIPE_EXPERIMENT_ID,
        filename: dataFileStem + ".csv",
        data_string: function() {
          return jsPsych.data
            .get()
            .ignore("stimulus")
            .csv();
        },
        data: {
          task: "datapipe_save"
        }
      };

      timeline.push(datapipe_save_trial);

      var online_save_confirmation = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus:
          '<p style="font-size: 24px;">' +
          'Data saved successfully.' +
          '</p>' +
          '<p>You can close this window.</p>',
        choices: "NO_KEYS",
        data: {
          task: "online_save_confirmation"
        }
      };

      timeline.push(online_save_confirmation);
    }


    // ================================================================
    // 13. START THE EXPERIMENT
    // ================================================================

    jsPsych.run(timeline);
    }

    startExperiment().catch(function(error) {
      console.error("Experiment startup error:", error);

      document.body.innerHTML = `
        <main style="
          max-width: 850px;
          margin: 60px auto;
          padding: 30px;
          color: white;
          font-family: Arial, sans-serif;
          line-height: 1.5;
        ">
          <h1>Experiment could not start</h1>
          <p>${error.message}</p>
          <p>Open the browser developer console for additional details.</p>
        </main>
      `;
    });
  </script>
</html>
