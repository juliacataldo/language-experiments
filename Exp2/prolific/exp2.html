  <script>
    async function startExperiment() {
    // ================================================================
    // 1. GENERAL SETTINGS
    // ================================================================

    /*
     * Continuous lexical-decision timing.
     *
     * Every spreadsheet row is one displayed lexical-decision trial. Word
     * prime-target rows share a unit_id and remain adjacent; nonwords are
     * independent one-row units. The participant presses F or J for every
     * displayed letter string.
     *
     * Trial sequence:
     *   fixation: 200 ms
     *   blank:    200 ms
     *   stimulus: remains visible until response
     *   response timeout: none
     *   post-response interval: randomly 300, 350, or 400 ms
     */
    var FIXATION_DURATION_MS = 200;
    var PRE_STIMULUS_BLANK_MS = 200;
    var ITI_OPTIONS_MS = [300, 350, 400];
    var PRACTICE_PASS_THRESHOLD = 0.70;

    var STIMULUS_ONSET_MS =
      FIXATION_DURATION_MS + PRE_STIMULUS_BLANK_MS;

    /*
     * Upload the approved consent PDF to the same folder as this file
     * and name it consent.pdf.
     */
    var CONSENT_PDF_FILE = "consent.pdf";

    /*
     * Keep both CSV files in the same folder as this HTML file.
     * The main file contains all four counterbalanced versions. An explicit
     * ?version=1, ?version=2, ?version=3, or ?version=4 overrides automatic
     * version assignment.
     */
    var MAIN_STIMULI_FILE = "main_stimuli.csv";
    var PRACTICE_STIMULI_FILE = "practice_stimuli.csv";
    var DATAPIPE_EXPERIMENT_ID = "0Zb0XHTy8RcV";

    /*
     * Automatic run-mode selection:
     * - localhost / 127.0.0.1 / 0.0.0.0 -> local Python saving
     * - every other hostname (including GitHub Pages) -> DataPipe saving
     */
    var LOCAL_HOSTNAMES = ["localhost", "127.0.0.1", "0.0.0.0"];
    var IS_LOCAL_RUN =
      LOCAL_HOSTNAMES.includes(window.location.hostname);
    var RUN_MODE = IS_LOCAL_RUN ? "local" : "online_datapipe";

    var urlParameters =
      new URLSearchParams(window.location.search);
    var selectedVersion;
    var versionAssignmentMethod;

    async function resolveExperimentalVersion() {
      var requestedVersion =
        urlParameters.get("version");

      if (requestedVersion !== null) {
        var parsedVersion = Number(requestedVersion);

        if (
          !Number.isInteger(parsedVersion) ||
          parsedVersion < 1 ||
          parsedVersion > 4
        ) {
          throw new Error(
            'O parâmetro "version" da URL deve ser 1, 2, 3 ou 4.'
          );
        }

        return {
          version: parsedVersion,
          assignment_method: "url_parameter"
        };
      }

      if (IS_LOCAL_RUN) {
        return {
          version: (Number(participantId) % 4) + 1,
          assignment_method:
            "local_internal_participant_id_modulo"
        };
      }

      var storageKey =
        "continuous_lexical_decision_counterbalance_version";

      try {
        var cachedVersion = Number(
          window.sessionStorage.getItem(storageKey)
        );

        if (
          Number.isInteger(cachedVersion) &&
          cachedVersion >= 1 &&
          cachedVersion <= 4
        ) {
          return {
            version: cachedVersion,
            assignment_method:
              "datapipe_sequential_cached"
          };
        }
      } catch (error) {
        // Continue to DataPipe assignment if sessionStorage is unavailable.
      }

      var response = await fetch(
        "https://pipe.jspsych.org/api/condition/",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            experimentID: DATAPIPE_EXPERIMENT_ID
          })
        }
      );

      var payload = {};

      try {
        payload = await response.json();
      } catch (error) {
        throw new Error(
          "O DataPipe retornou uma resposta ilegível para a atribuição de versão."
        );
      }

      if (!response.ok) {
        throw new Error(
          "Não foi possível obter uma versão experimental do DataPipe. " +
          (payload.message || "Erro desconhecido do DataPipe.") +
          " Confirme que a atribuição de condições está ativada e " +
          "configurada para quatro condições no painel do experimento."
        );
      }

      var conditionNumber = Number(payload.condition);

      if (
        !Number.isInteger(conditionNumber) ||
        conditionNumber < 0 ||
        conditionNumber > 3
      ) {
        throw new Error(
          "O DataPipe retornou a condição " +
          String(payload.condition) +
          ". Este experimento requer exatamente quatro condições (0–3)."
        );
      }

      var assignedVersion = conditionNumber + 1;

      try {
        window.sessionStorage.setItem(
          storageKey,
          String(assignedVersion)
        );
      } catch (error) {
        // Assignment still works if sessionStorage is unavailable.
      }

      return {
        version: assignedVersion,
        assignment_method: "datapipe_sequential"
      };
    }

    if (window.location.protocol === "file:") {
      throw new Error(
        "Esta versão carrega os estímulos dos arquivos " +
        MAIN_STIMULI_FILE + " e " + PRACTICE_STIMULI_FILE + ". " +
        "Execute o experimento por meio do servidor Python em " +
        "http://localhost:8000/, em vez de abrir o arquivo HTML com dois cliques."
      );
    }

    if (
      !IS_LOCAL_RUN &&
      DATAPIPE_EXPERIMENT_ID ===
        "PASTE_YOUR_DATAPIPE_EXPERIMENT_ID_HERE"
    ) {
      throw new Error(
        "O salvamento on-line ainda não está configurado. Substitua " +
        "PASTE_YOUR_DATAPIPE_EXPERIMENT_ID_HERE pelo ID do experimento " +
        "exibido no painel do DataPipe."
      );
    }

    var jsPsych = initJsPsych({
      show_progress_bar: true,
      auto_update_progress_bar: false,
      message_progress_bar: "Progresso do experimento"
    });

    var timeline = [];

    function generateRandomEightDigitId() {
      if (window.crypto && window.crypto.getRandomValues) {
        var randomValues = new Uint32Array(1);
        window.crypto.getRandomValues(randomValues);

        return String(
          10000000 + (randomValues[0] % 90000000)
        );
      }

      return String(
        Math.floor(10000000 + Math.random() * 90000000)
      );
    }

    var participantId = generateRandomEightDigitId();
    var versionAssignment =
      await resolveExperimentalVersion();

    selectedVersion = versionAssignment.version;
    versionAssignmentMethod =
      versionAssignment.assignment_method;

    var randomizationSeed = hashStringToUint32(
      participantId + "|version=" + selectedVersion
    );
    var experimentRandom = mulberry32(randomizationSeed);

    var sessionTimestamp = new Date()
      .toISOString()
      .replace(/[^0-9]/g, "")
      .slice(0, 14);

    var dataFileStem =
      "continuous_lexical_decision_" +
      participantId +
      "_v" +
      selectedVersion +
      "_" +
      sessionTimestamp;

    jsPsych.data.addProperties({
      participant_id: participantId,
      experimental_version: selectedVersion,
      version_assignment_method: versionAssignmentMethod,
      randomization_seed: randomizationSeed,
      run_mode: RUN_MODE,
      session_timestamp_utc: sessionTimestamp,
      main_stimuli_file: MAIN_STIMULI_FILE,
      practice_stimuli_file: PRACTICE_STIMULI_FILE,
      experiment_paradigm: "continuous_lexical_decision"
    });


    // ================================================================
    // 2. HELPER FUNCTIONS
    // ================================================================

    function makePsychophysicsText(
      content,
      showStartTime,
      showEndTime,
      fontSize
    ) {
      var stimulus = {
        obj_type: "text",
        content: content,
        startX: 0,
        startY: 0,
        origin_center: true,
        fontSize: fontSize || "40px",
        fontFamily: "Courier New, Courier, monospace",
        fontWeight: "normal",
        text_color: "#ffffff",
        show_start_time: showStartTime
      };

      if (showEndTime !== undefined) {
        stimulus.show_end_time = showEndTime;
      }

      return stimulus;
    }

    function calculateAccuracy(dataCollection) {
      var total = dataCollection.count();

      if (total === 0) {
        return 0;
      }

      var numberCorrect =
        dataCollection.filter({ correct: true }).count();

      return numberCorrect / total;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function hashStringToUint32(text) {
      var hash = 2166136261;

      for (var index = 0; index < text.length; index++) {
        hash ^= text.charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }

      return hash >>> 0;
    }

    function mulberry32(seed) {
      return function() {
        var value = seed += 0x6D2B79F5;
        value = Math.imul(value ^ (value >>> 15), value | 1);
        value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
        return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
      };
    }

    function chooseRandomValue(values) {
      return values[
        Math.floor(experimentRandom() * values.length)
      ];
    }

    function shuffleArray(values) {
      var shuffled = values.slice();

      for (var index = shuffled.length - 1; index > 0; index--) {
        var randomIndex =
          Math.floor(experimentRandom() * (index + 1));
        var temporaryValue = shuffled[index];
        shuffled[index] = shuffled[randomIndex];
        shuffled[randomIndex] = temporaryValue;
      }

      return shuffled;
    }

    /*
     * Parse an ordinary comma-delimited CSV, including quoted fields and
     * commas inside quoted fields. Save the spreadsheet from Excel as
     * "CSV UTF-8 (Comma delimited)".
     */
    function parseCSV(csvText) {
      var rows = [];
      var row = [];
      var field = "";
      var insideQuotes = false;

      for (var index = 0; index < csvText.length; index++) {
        var character = csvText[index];
        var nextCharacter = csvText[index + 1];

        if (character === '"') {
          if (insideQuotes && nextCharacter === '"') {
            field += '"';
            index++;
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (character === "," && !insideQuotes) {
          row.push(field);
          field = "";
        } else if (
          (character === "\n" || character === "\r") &&
          !insideQuotes
        ) {
          if (character === "\r" && nextCharacter === "\n") {
            index++;
          }

          row.push(field);
          field = "";

          if (row.some(function(value) { return value.trim() !== ""; })) {
            rows.push(row);
          }

          row = [];
        } else {
          field += character;
        }
      }

      row.push(field);
      if (row.some(function(value) { return value.trim() !== ""; })) {
        rows.push(row);
      }

      return rows;
    }

    async function loadPracticeStimuli(filename) {
      var response = await fetch(filename, { cache: "no-store" });

      if (!response.ok) {
        throw new Error(
          "Não foi possível carregar " + filename +
          ". O servidor retornou o código HTTP " + response.status + "."
        );
      }

      var parsedRows = parseCSV(await response.text());

      if (parsedRows.length !== 9) {
        throw new Error(
          filename +
          " deve conter uma linha de cabeçalho e exatamente oito tentativas de prática."
        );
      }

      var headers = parsedRows[0].map(function(header) {
        return header.replace(/^\uFEFF/, "").trim();
      });
      var requiredColumns = [
        "stimulus_id",
        "stimulus",
        "lexicality",
        "feedback"
      ];

      requiredColumns.forEach(function(columnName) {
        if (!headers.includes(columnName)) {
          throw new Error(
            filename + " não contém a coluna obrigatória \"" +
            columnName + "\"."
          );
        }
      });

      var practiceRows = parsedRows.slice(1).map(
        function(values, rowIndex) {
          var practiceRow = {};

          headers.forEach(function(header, columnIndex) {
            practiceRow[header] =
              String(values[columnIndex] || "").trim();
          });

          practiceRow.lexicality =
            practiceRow.lexicality.toLowerCase();

          requiredColumns.forEach(function(columnName) {
            if (!practiceRow[columnName]) {
              throw new Error(
                "A linha " + (rowIndex + 2) + " do CSV de prática " +
                "tem um valor em branco na coluna \"" + columnName + "\"."
              );
            }
          });

          if (!["word", "nonword"].includes(practiceRow.lexicality)) {
            throw new Error(
              "A linha " + (rowIndex + 2) + " do CSV de prática " +
              "tem um valor inválido de lexicality."
            );
          }

          return Object.assign({}, practiceRow, {
            unit_id: practiceRow.stimulus_id,
            unit_type: "practice_singleton",
            within_unit_position: 1,
            pair_cell: "practice",
            pair_role: "practice",
            correct_response:
              practiceRow.lexicality === "word" ? "j" : "f",
            condition: "practice"
          });
        }
      );

      var practiceIds = practiceRows.map(function(practiceRow) {
        return practiceRow.stimulus_id;
      });

      if (new Set(practiceIds).size !== practiceIds.length) {
        throw new Error(
          filename + " contém valores duplicados de stimulus_id."
        );
      }

      return practiceRows;
    }

    async function loadExperimentInput(filename, requestedVersion) {
      var response = await fetch(filename, { cache: "no-store" });

      if (!response.ok) {
        throw new Error(
          "Não foi possível carregar " + filename +
          ". O servidor retornou o código HTTP " + response.status + "."
        );
      }

      var csvText = await response.text();
      var parsedRows = parseCSV(csvText);

      if (parsedRows.length < 2) {
        throw new Error(
          filename +
          " deve conter uma linha de cabeçalho e linhas de estímulos."
        );
      }

      var headers = parsedRows[0].map(function(header) {
        return header.replace(/^\uFEFF/, "").trim();
      });

      if (headers.some(function(header) { return header === ""; })) {
        throw new Error(
          filename +
          " contém um nome de coluna em branco na primeira linha."
        );
      }

      if (new Set(headers).size !== headers.length) {
        throw new Error(
          filename + " contém nomes de colunas duplicados."
        );
      }

      var requiredColumns = [
        "version",
        "block",
        "unit_id",
        "unit_type",
        "within_unit_position",
        "pair_cell",
        "pair_role",
        "stimulus_id",
        "stimulus",
        "lexicality",
        "condition",
        "prime_condition",
        "target_condition",
        "zipf_scale"
      ];

      requiredColumns.forEach(function(columnName) {
        if (!headers.includes(columnName)) {
          throw new Error(
            filename + " não contém a coluna obrigatória \"" +
            columnName + "\"."
          );
        }
      });

      var rows = parsedRows.slice(1).map(function(values, rowIndex) {
        var stimulusRow = {};

        headers.forEach(function(header, columnIndex) {
          stimulusRow[header] =
            String(values[columnIndex] || "").trim();
        });

        stimulusRow.version = Number(stimulusRow.version);
        stimulusRow.block = Number(stimulusRow.block);
        stimulusRow.within_unit_position =
          Number(stimulusRow.within_unit_position);
        stimulusRow.unit_type =
          stimulusRow.unit_type.toLowerCase();
        stimulusRow.pair_role =
          stimulusRow.pair_role.toLowerCase();
        stimulusRow.lexicality =
          stimulusRow.lexicality.toLowerCase();

        [
          "unit_id",
          "unit_type",
          "pair_cell",
          "pair_role",
          "stimulus_id",
          "stimulus",
          "condition",
          "lexicality"
        ].forEach(function(columnName) {
          if (!stimulusRow[columnName]) {
            throw new Error(
              "A linha " + (rowIndex + 2) + " do CSV tem um valor " +
              "em branco na coluna \"" + columnName + "\"."
            );
          }
        });

        if (![1, 2, 3, 4].includes(stimulusRow.version)) {
          throw new Error(
            "A linha " + (rowIndex + 2) +
            " do CSV tem uma versão inválida."
          );
        }

        if (![1, 2, 3].includes(stimulusRow.block)) {
          throw new Error(
            "A linha " + (rowIndex + 2) +
            " do CSV tem um bloco inválido."
          );
        }

        if (![1, 2].includes(stimulusRow.within_unit_position)) {
          throw new Error(
            "A linha " + (rowIndex + 2) +
            " do CSV tem um within_unit_position inválido."
          );
        }

        if (
          !["prime_target_pair", "nonword_singleton"].includes(
            stimulusRow.unit_type
          )
        ) {
          throw new Error(
            "A linha " + (rowIndex + 2) +
            " do CSV tem um unit_type inválido."
          );
        }

        if (!["prime", "target", "nonword"].includes(stimulusRow.pair_role)) {
          throw new Error(
            "A linha " + (rowIndex + 2) +
            " do CSV tem um pair_role inválido."
          );
        }

        if (!["word", "nonword"].includes(stimulusRow.lexicality)) {
          throw new Error(
            "A linha " + (rowIndex + 2) +
            " do CSV tem um valor inválido de lexicality."
          );
        }

        if (stimulusRow.zipf_scale === "") {
          stimulusRow.zipf_scale = null;
        } else {
          stimulusRow.zipf_scale = Number(stimulusRow.zipf_scale);

          if (!Number.isFinite(stimulusRow.zipf_scale)) {
            throw new Error(
              "A linha " + (rowIndex + 2) +
              " do CSV tem um zipf_scale não numérico."
            );
          }
        }

        stimulusRow.correct_response =
          stimulusRow.lexicality === "word" ? "j" : "f";

        return stimulusRow;
      });

      var selectedRows = rows.filter(function(stimulusRow) {
        return stimulusRow.version === requestedVersion;
      });

      if (selectedRows.length !== 180) {
        throw new Error(
          "A versão " + requestedVersion +
          " deve conter exatamente 180 tentativas. Foram encontradas " +
          selectedRows.length + "."
        );
      }

      var stimulusIds = selectedRows.map(function(stimulusRow) {
        return stimulusRow.stimulus_id;
      });

      if (new Set(stimulusIds).size !== stimulusIds.length) {
        throw new Error(
          "A versão " + requestedVersion +
          " contém valores duplicados de stimulus_id."
        );
      }

      validateSelectedVersion(selectedRows, requestedVersion);

      return {
        headers: headers,
        rows: selectedRows
      };
    }

    function groupRowsByUnit(rows) {
      var unitMap = new Map();

      rows.forEach(function(stimulusRow) {
        if (!unitMap.has(stimulusRow.unit_id)) {
          unitMap.set(stimulusRow.unit_id, []);
        }

        unitMap.get(stimulusRow.unit_id).push(stimulusRow);
      });

      return Array.from(unitMap.values());
    }

    function validateSelectedVersion(rows, requestedVersion) {
      var expectedPairCells = [
        "high_in__high_des",
        "low_re__high_des",
        "high_in__low_des",
        "low_re__low_des"
      ];

      var wordCount = rows.filter(function(stimulusRow) {
        return stimulusRow.lexicality === "word";
      }).length;
      var nonwordCount = rows.filter(function(stimulusRow) {
        return stimulusRow.lexicality === "nonword";
      }).length;

      if (wordCount !== 120 || nonwordCount !== 60) {
        throw new Error(
          "A versão " + requestedVersion +
          " deve conter 120 tentativas com palavras e 60 com não palavras."
        );
      }

      [1, 2, 3].forEach(function(blockNumber) {
        var blockRows = rows.filter(function(stimulusRow) {
          return stimulusRow.block === blockNumber;
        });
        var units = groupRowsByUnit(blockRows);
        var pairUnits = units.filter(function(unit) {
          return unit[0].unit_type === "prime_target_pair";
        });
        var nonwordUnits = units.filter(function(unit) {
          return unit[0].unit_type === "nonword_singleton";
        });

        if (
          blockRows.length !== 60 ||
          units.length !== 40 ||
          pairUnits.length !== 20 ||
          nonwordUnits.length !== 20
        ) {
          throw new Error(
            "A versão " + requestedVersion + ", bloco " + blockNumber +
            ", deve ter 60 tentativas em 40 unidades: 20 pares de " +
            "palavras e 20 não palavras independentes."
          );
        }

        pairUnits.forEach(function(unit) {
          unit.sort(function(first, second) {
            return first.within_unit_position -
              second.within_unit_position;
          });

          var prime = unit[0];
          var target = unit[1];
          var expectedCell =
            prime.prime_condition + "__" + prime.target_condition;

          if (
            unit.length !== 2 ||
            prime.pair_role !== "prime" ||
            target.pair_role !== "target" ||
            prime.within_unit_position !== 1 ||
            target.within_unit_position !== 2 ||
            prime.lexicality !== "word" ||
            target.lexicality !== "word" ||
            prime.condition !== prime.prime_condition ||
            target.condition !== target.target_condition ||
            target.prime_condition !== prime.prime_condition ||
            target.target_condition !== prime.target_condition ||
            prime.pair_cell !== expectedCell ||
            target.pair_cell !== expectedCell
          ) {
            throw new Error(
              "Estrutura prime-alvo inválida na unidade " +
              prime.unit_id + "."
            );
          }
        });

        nonwordUnits.forEach(function(unit) {
          var nonword = unit[0];

          if (
            unit.length !== 1 ||
            nonword.pair_role !== "nonword" ||
            nonword.within_unit_position !== 1 ||
            nonword.lexicality !== "nonword" ||
            nonword.pair_cell !== "nonword"
          ) {
            throw new Error(
              "Estrutura de não palavra independente inválida na unidade " +
              nonword.unit_id + "."
            );
          }
        });

        expectedPairCells.forEach(function(pairCell) {
          var cellCount = pairUnits.filter(function(unit) {
            return unit[0].pair_cell === pairCell;
          }).length;

          if (cellCount !== 5) {
            throw new Error(
              "A versão " + requestedVersion + ", bloco " + blockNumber +
              ", deve conter cinco unidades em " + pairCell + "."
            );
          }
        });

        [
          ["nonword_des", 10],
          ["nonword_re", 5],
          ["nonword_in_im", 5]
        ].forEach(function(expectedCondition) {
          var conditionCount = nonwordUnits.filter(function(unit) {
            return unit[0].condition === expectedCondition[0];
          }).length;

          if (conditionCount !== expectedCondition[1]) {
            throw new Error(
              "A versão " + requestedVersion + ", bloco " + blockNumber +
              ", tem uma contagem inesperada para " +
              expectedCondition[0] + "."
            );
          }
        });
      });
    }

    function unitCategory(unit) {
      return unit[0].unit_type === "prime_target_pair"
        ? "pair"
        : "nonword";
    }

    function respectsUnitRunLimit(units, maximumRunLength) {
      var previousCategory = "";
      var runLength = 0;

      for (var index = 0; index < units.length; index++) {
        var category = unitCategory(units[index]);

        if (category === previousCategory) {
          runLength++;
        } else {
          previousCategory = category;
          runLength = 1;
        }

        if (runLength > maximumRunLength) {
          return false;
        }
      }

      return true;
    }

    function shuffleUnitsWithRunLimit(units) {
      for (var attempt = 0; attempt < 1000; attempt++) {
        var pairUnits = shuffleArray(
          units.filter(function(unit) {
            return unitCategory(unit) === "pair";
          })
        );
        var nonwordUnits = shuffleArray(
          units.filter(function(unit) {
            return unitCategory(unit) === "nonword";
          })
        );
        var randomizedUnits = [];
        var previousCategory = "";
        var runLength = 0;

        while (pairUnits.length > 0 || nonwordUnits.length > 0) {
          var availableCategories = [];

          if (
            pairUnits.length > 0 &&
            !(previousCategory === "pair" && runLength === 2)
          ) {
            availableCategories.push("pair");
          }

          if (
            nonwordUnits.length > 0 &&
            !(previousCategory === "nonword" && runLength === 2)
          ) {
            availableCategories.push("nonword");
          }

          if (availableCategories.length === 0) {
            break;
          }

          var chosenCategory;

          if (availableCategories.length === 1) {
            chosenCategory = availableCategories[0];
          } else {
            var pairProbability =
              pairUnits.length /
              (pairUnits.length + nonwordUnits.length);
            chosenCategory =
              experimentRandom() < pairProbability
                ? "pair"
                : "nonword";
          }

          randomizedUnits.push(
            chosenCategory === "pair"
              ? pairUnits.pop()
              : nonwordUnits.pop()
          );

          if (chosenCategory === previousCategory) {
            runLength++;
          } else {
            previousCategory = chosenCategory;
            runLength = 1;
          }
        }

        if (
          randomizedUnits.length === units.length &&
          respectsUnitRunLimit(randomizedUnits, 2)
        ) {
          return randomizedUnits;
        }
      }

      throw new Error(
        "Não foi possível criar uma ordem aleatória válida para as unidades."
      );
    }

    /*
     * Block membership and word-pair composition come from the spreadsheet.
     * Only whole units are shuffled. A word pair is expanded after shuffling,
     * so its prime always remains immediately before its target. Nonwords are
     * one-row units and are never treated as pairs.
     */
    function buildRandomizedBlocks(rows) {
      var blocks = [[], [], []];
      var overallUnitOrder = 1;
      var overallTrialOrder = 1;

      for (var blockNumber = 1; blockNumber <= 3; blockNumber++) {
        var blockRows = rows.filter(function(stimulusRow) {
          return stimulusRow.block === blockNumber;

        var randomizedUnits =
          shuffleUnitsWithRunLimit(groupRowsByUnit(blockRows));
        var blockTrialNumber = 1;

        randomizedUnits.forEach(function(unit, unitIndex) {
          var orderedUnit = unit.slice().sort(function(first, second) {
            return first.within_unit_position -
              second.within_unit_position;
          });

          orderedUnit.forEach(function(stimulusRow) {
            var partner = orderedUnit.find(function(candidate) {
              return candidate.stimulus_id !== stimulusRow.stimulus_id;

            blocks[blockNumber - 1].push(

                paired_stimulus:

                randomized_trial_order: overallTrialOrder,
                iti_duration_ms: chooseRandomValue(ITI_OPTIONS_MS)
              })
            );

            blockTrialNumber++;
            overallTrialOrder++;
          });

          overallUnitOrder++;
        });
      }

      return blocks;
    }

                data.randomized_trial_order;
          } else {
            data.preceding_prime_stimulus_id = "";
            data.preceding_prime_stimulus = "";
            data.preceding_prime_response = "";
            data.preceding_prime_correct = "";
            data.preceding_prime_rt = "";
            data.prime_target_pair_verified = false;
          }
        } else {
          data.preceding_prime_stimulus_id = "";
          data.preceding_prime_stimulus = "";
          data.preceding_prime_response = "";
          data.preceding_prime_correct = "";
          data.preceding_prime_rt = "";
          data.prime_target_pair_verified = "";
        }
      }
    };

    function makePauseScreen(completedBlock) {
      return {
        type: jsPsychHtmlKeyboardResponse,

        stimulus: `
          <div class="text-screen">
            <h1>Pausa</h1>

            <p>
              Você concluiu o bloco ${completedBlock} de 3.
            </p>

            <p>
              Você pode fazer uma breve pausa.
            </p>

            <p class="continue-prompt">
              Pressione qualquer tecla quando estiver pronto(a) para continuar.
            </p>
          </div>
        `,

        data: {
          task: "pause",
          block_completed: completedBlock
        },

        on_load: function() {
          jsPsych.progressBar.progress = completedBlock / 3;
        }
      };
    }

    for (var blockNumber = 1; blockNumber <= 3; blockNumber++) {
      var trialsForThisBlock = main_blocks[blockNumber - 1];

      var experimentalBlock = {
        timeline: [main_continuous_trial],
        timeline_variables: trialsForThisBlock,

        /*
         * Whole units have already been shuffled. Do not randomize here,
         * because that would separate a target from its preceding prime.
         */
        randomize_order: false
      };

      timeline.push(experimentalBlock);

      if (blockNumber < 3) {
        timeline.push(makePauseScreen(blockNumber));
      }
    }


    // ================================================================
    // 10. FINAL SUMMARY
    // ================================================================

    var final_screen = {
      type: jsPsychHtmlKeyboardResponse,

      stimulus: function() {
        var allTrials =
          jsPsych.data
            .get()
            .filter({ task: "main_lexical_decision" });

        var correctTrials = allTrials.filter({ correct: true });

        var overallAccuracy = calculateAccuracy(allTrials);

        var overallAccuracyPercent =
          Math.round(overallAccuracy * 100);

        var meanCorrectRt =
          correctTrials.count() > 0
            ? Math.round(correctTrials.select("rt").mean())
            : "N/D";

        return `
          <div class="text-screen">
            <h1>A tarefa principal foi concluída!</h1>

            <p>
              Seu percentual geral de acertos foi de
              <strong>${overallAccuracyPercent}%</strong>.
            </p>

            <p>
              Seu tempo médio de resposta nas tentativas corretas foi de
              <strong>${meanCorrectRt} ms</strong>.
            </p>

            <p class="continue-prompt">
              Pressione qualquer tecla para continuar para o questionário final.
            </p>
          </div>
        `;
      },

      data: {

      },

      on_load: function() {
        jsPsych.progressBar.progress = 1;
      }
    };

    timeline.push(final_screen);

    function configureConditionalSurveySection(
      controllingName,
      visibleValue,
      containerId
    ) {
      var controls =
        document.querySelectorAll(
          'input[name="' +
          controllingName +
          '"]'
        );

      var container =
        document.getElementById(
          containerId
        );

      function updateSection() {
        var selected =
          document.querySelector(
            'input[name="' +
            controllingName +
            '"]:checked'
          );

        var shouldShow =
          selected &&
          selected.value === visibleValue;

        container.classList.toggle(
          "visible",
          Boolean(shouldShow)
        );

        container
          .querySelectorAll(
            "input, select, textarea"
          )
          .forEach(function(control) {
            control.disabled =
              !shouldShow;

            control.required =
              Boolean(shouldShow) &&
              control.dataset
                .requiredWhenVisible ===
                "true";

            if (!shouldShow) {
              if (
                control.type === "radio" ||
                control.type === "checkbox"
              ) {
                control.checked = false;
              } else {
                control.value = "";
              }
            }
          });
      }

      controls.forEach(function(control) {
        control.addEventListener(
          "change",
          updateSection
        );
      });

      updateSection();
    }


    function activateLanguageBackgroundSurvey() {
      var surveyStartTime =
        performance.now();

      configureConditionalSurveySection(
        "gender",
        "Other",
        "gender-other-details"
      );

      configureConditionalSurveySection(
        "home_other_language",
        "yes",
        "home-language-details"
      );

      configureConditionalSurveySection(
        "school_work_other_language",
        "yes",
        "school-work-language-details"
      );

      configureConditionalSurveySection(
        "lived_other_language_places",
        "yes",
        "other-language-places-details"
      );

      var form =
        document.getElementById(
          "language-background-form"
        );

      var submitButton =
        document.getElementById(
          "language-survey-submit"
        );

      /*
      * Prevent Enter inside a questionnaire field from
      * submitting the form accidentally.
      *
      * Enter remains available inside textareas so that
      * participants can create a new line.
      */
      form.addEventListener(
        "keydown",
        function(event) {
          if (
            event.key === "Enter" &&
            event.target.tagName !== "TEXTAREA"
          ) {
            event.preventDefault();
          }
        }
      );

      submitButton.addEventListener(
        "click",
        function() {
          /*
          * Do not continue until all required fields
          * have valid responses.
          */
          if (!form.reportValidity()) {
            return;
          }

          /*
          * Prevent repeated clicks while the trial
          * is being completed.
          */
          submitButton.disabled = true;
          submitButton.textContent =
            "Enviando questionário...";

          var formData =
            new FormData(form);

          var trialData = {
            task:
              "language_background_survey",

            phase:
              "post_experiment_survey",

            language_survey_rt:
              Math.round(
                performance.now() -
                surveyStartTime
              )
          };

          [
            "gender",
            "gender_other",
            "age",
            "education",
            "daily_languages",
            "home_other_language",
            "home_languages",
            "home_exposure_years",
            "home_relative_use",
            "school_work_other_language",
            "school_work_languages",
            "school_work_exposure_years",
            "school_work_relative_use",
            "brazil_growing_up_years",
            "current_country",
            "current_country_years",
            "lived_other_language_places",
            "other_language_places",
            "language_background_comments"
          ].forEach(function(fieldName) {
            trialData[
              "language_" + fieldName
            ] =
              formData.get(fieldName) || "";
          });

          var interactionData =
            jsPsych.data.getInteractionData().values();

          trialData.browser_interactions_json =
            JSON.stringify(interactionData);

          trialData.blur_count =
            interactionData.filter(function(interactionEvent) {
              return interactionEvent.type === "blur";
            }).length;

          trialData.focus_count =
            interactionData.filter(function(interactionEvent) {
              return interactionEvent.type === "focus";
            }).length;

          jsPsych.finishTrial(
            trialData
          );
        }
      );
    }
